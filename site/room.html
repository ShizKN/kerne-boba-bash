<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>KERNE - Study room</title>
    <link rel="icon" type="image/png" href="Logo.png" />
    <script src="/config.js"></script>
    <script src="/signaling.js"></script>
    <script src="/vendor/simplepeer.min.js"></script>
    <script src="/activities.js" defer></script>
    <link rel="stylesheet" href="/room.css">

</head>

<body>
    <div class="app-container" id="appContainer">
        <div class="header">
            <div class="logo-header">KERNE</div>
            <div class="room-info" id="roomInfo">Connecting...</div>
        </div>
        <div class="permission-notice" id="permissionNotice" role="status">
            <strong id="permissionTitle">Camera or microphone off</strong>
            <div id="permissionHelp">Allow access in your site settings (icon next to the address), then try again. On a phone, also check your browser settings.</div>
            <button type="button" id="retryRoomCamera">Turn on camera</button>
            <button type="button" id="retryRoomMic">Turn on microphone</button>
            <button type="button" id="dismissPermissionNotice">Later</button>
        </div>
        <div class="video-grid" id="videoGrid"><div id="screenStage"></div><div id="cameraStrip"></div></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" data-tab="chat">CHAT</button>
                <button class="sidebar-tab" data-tab="participants">PARTICIPANTS</button>
            </div>
            <div class="sidebar-content">
                <div class="tab-panel active" id="chatPanel">
                    <div id="chatMessages"></div>
                    <form id="chatForm"><input type="text" id="chatInput" placeholder="Write a message..."
                            autocomplete="off"><button type="submit" class="send-btn">➤</button></form>
                </div>
                <div class="tab-panel" id="participantsPanel">
                    <div id="participantsList"></div>
                </div>
            </div>
        </div>
        <div class="controls">
            <div class="control-wrapper" id="camWrapper">
                <button class="control-btn active" id="camBtn" title="Camera"><svg viewBox="0 0 24 24">
                        <path d="M23 7l-7 5 7 5V7z" />
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                    </svg></button>
                <button class="device-selector-btn" id="camSelector" title="Choose camera"><svg viewBox="0 0 24 24">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg></button>
                <div class="device-menu" id="camMenu"></div>
            </div>
            <div class="control-wrapper" id="micWrapper">
                <button class="control-btn active" id="micBtn" title="Microphone"><svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                    </svg></button>
                <button class="device-selector-btn" id="micSelector" title="Choose microphone"><svg viewBox="0 0 24 24">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg></button>
                <div class="device-menu" id="micMenu"></div>
            </div>
            <button class="control-btn" id="sidebarToggle" title="Chat" style="opacity:1"><svg viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg></button>
            <button class="control-btn" id="screenShareBtn" title="Share screen" aria-label="Share screen"><svg viewBox="0 0 24 24">
                    <rect x="2" y="3" width="20" height="15" rx="2" /><line x1="8" y1="22" x2="16" y2="22" /><line x1="12" y1="18" x2="12" y2="22" />
                </svg></button>
            <button class="control-btn" id="leaveBtn" title="Leave room"><svg viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg></button>
        </div>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
    </div>

    <div class="sound-control-wrapper">
        <button class="sound-btn active" id="soundBtn" title="Sound">
            <svg viewBox="0 0 24 24">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
        </button>
        <button class="sound-device-selector" id="soundSelector" title="Choose audio output"><svg viewBox="0 0 24 24">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg></button>
        <div class="sound-device-menu" id="soundMenu"></div>
    </div>

    <dialog id="screenViewer" aria-labelledby="viewerTitle">
        <header class="viewer-header"><div><strong id="viewerTitle">Shared screen</strong><small>Pinch or use + to zoom. Drag to explore.</small></div><button id="viewerClose" aria-label="Close full screen view">✕</button></header>
        <div id="viewerViewport"><video id="viewerVideo" autoplay playsinline muted></video></div>
        <div id="viewerCameras" aria-label="Call cameras"></div>
        <footer class="viewer-tools"><button id="viewerOut" aria-label="Zoom out">−</button><output id="viewerZoom">100%</output><button id="viewerIn" aria-label="Zoom in">+</button><button id="viewerFit">Fit</button><button id="viewerCameraToggle" aria-pressed="true">Cameras</button></footer>
    </dialog>

    <div class="toast" id="toast"></div>

    <script>
        'use strict';
        let ICE_CONFIG = { iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }] };

        class ScreenViewer {
            constructor() {
                this.dialog = document.getElementById('screenViewer');
                this.viewport = document.getElementById('viewerViewport');
                this.video = document.getElementById('viewerVideo');
                this.scale = 1; this.x = 0; this.y = 0; this.pointers = new Map();
                document.getElementById('viewerClose').onclick = () => this.dialog.close();
                document.getElementById('viewerFit').onclick = () => { this.scale = 1; this.x = this.y = 0; this.paint(); };
                document.getElementById('viewerIn').onclick = () => this.zoom(this.scale + .5);
                document.getElementById('viewerOut').onclick = () => this.zoom(this.scale - .5);
                document.getElementById('viewerCameraToggle').onclick = event => {
                    const rail = document.getElementById('viewerCameras'); rail.hidden = !rail.hidden;
                    event.currentTarget.setAttribute('aria-pressed', String(!rail.hidden)); this.paint();
                };
                this.dialog.addEventListener('close', () => { this.video.srcObject = null; document.getElementById('viewerCameras').replaceChildren(); this.pointers.clear(); });
                this.video.addEventListener('loadedmetadata', () => this.paint());
                this.viewport.addEventListener('dblclick', () => this.zoom(this.scale > 1 ? 1 : 2));
                this.viewport.addEventListener('wheel', event => { event.preventDefault(); this.zoom(this.scale * (event.deltaY < 0 ? 1.1 : .9)); }, { passive: false });
                this.viewport.addEventListener('pointerdown', event => {
                    this.viewport.setPointerCapture(event.pointerId);
                    this.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
                    this.distance = this.pinchDistance();
                });
                this.viewport.addEventListener('pointermove', event => {
                    const last = this.pointers.get(event.pointerId); if (!last) return;
                    this.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
                    if (this.pointers.size === 2) {
                        const distance = this.pinchDistance(); if (this.distance > 0) this.zoom(this.scale * distance / this.distance);
                        this.distance = distance;
                    } else { this.x += event.clientX - last.x; this.y += event.clientY - last.y; this.paint(); }
                });
                const release = event => { this.pointers.delete(event.pointerId); this.distance = this.pinchDistance(); };
                this.viewport.addEventListener('pointerup', release); this.viewport.addEventListener('pointercancel', release);
                this.dialog.addEventListener('keydown', event => {
                    if (event.key === '+' || event.key === '=') this.zoom(this.scale + .5);
                    if (event.key === '-') this.zoom(this.scale - .5);
                    const moves = { ArrowLeft: [40,0], ArrowRight: [-40,0], ArrowUp: [0,40], ArrowDown: [0,-40] };
                    if (moves[event.key]) { event.preventDefault(); this.x += moves[event.key][0]; this.y += moves[event.key][1]; this.paint(); }
                });
                new ResizeObserver(() => this.paint()).observe(this.viewport);
            }
            pinchDistance() { const [a,b] = [...this.pointers.values()]; return b ? Math.hypot(a.x-b.x,a.y-b.y) : 0; }
            zoom(value) { this.scale = Math.max(1,Math.min(5,value)); if (this.scale === 1) this.x = this.y = 0; this.paint(); }
            paint() {
                if (!this.dialog.open) return;
                const w = this.viewport.clientWidth, h = this.viewport.clientHeight;
                const ratio = (this.video.videoWidth || 16) / (this.video.videoHeight || 9);
                const bw = Math.min(w,h*ratio), bh = bw/ratio;
                const mx = Math.max(0,(bw*this.scale-w)/2), my = Math.max(0,(bh*this.scale-h)/2);
                this.x = Math.max(-mx,Math.min(mx,this.x)); this.y = Math.max(-my,Math.min(my,this.y));
                this.video.style.transform = `translate(${this.x}px,${this.y}px) scale(${this.scale})`;
                document.getElementById('viewerZoom').textContent = `${Math.round(this.scale*100)}%`;
                document.getElementById('viewerOut').disabled = this.scale === 1;
                document.getElementById('viewerIn').disabled = this.scale === 5;
            }
            open(tile) {
                this.tileId = tile.id; this.scale = 1; this.x = this.y = 0;
                this.video.srcObject = tile.querySelector('video').srcObject;
                document.getElementById('viewerTitle').textContent = tile.querySelector('.video-name').textContent;
                if (!this.dialog.open) this.dialog.showModal();
                this.refresh(); this.paint();
            }
            refresh() {
                if (!this.dialog.open) return;
                const tile = document.getElementById(this.tileId);
                if (!tile) { this.dialog.close(); return; }
                if (this.video.srcObject !== tile.querySelector('video').srcObject) this.video.srcObject = tile.querySelector('video').srcObject;
                const rail = document.getElementById('viewerCameras'); rail.replaceChildren();
                document.querySelectorAll('#cameraStrip .video-element').forEach(camera => {
                    const peek = document.createElement('div'); peek.className = 'viewer-peek';
                    const video = document.createElement('video'); video.autoplay = true; video.playsInline = true; video.muted = true;
                    const live = camera.dataset.cameraOn === 'true' && !!camera.querySelector('video').srcObject;
                    if (live) video.srcObject = camera.querySelector('video').srcObject;
                    const avatar = document.createElement('div'); avatar.className = 'viewer-camera-off'; avatar.textContent = camera.querySelector('.avatar-circle').textContent; avatar.hidden = live;
                    const name = document.createElement('span'); name.textContent = camera.querySelector('.video-name').textContent;
                    peek.append(video,avatar,name); rail.append(peek);
                });
            }
        }

        class WebRTCManager {
            constructor() {
                this.socket = null; this.localStream = null; this.peers = new Map();
                this.userInfo = new Map(); this.mySocketId = null;
                this.currentRoom = sessionStorage.getItem('currentRoom') || null;
                this.privateRoomCode = sessionStorage.getItem('privateRoomCode') || null;
                this.iceReady = false;
                this.pendingSignals = [];
                this.lastTransportRestart = 0;
                this.userName = sessionStorage.getItem('userName');
                const legacyLevels = { 'Collège': 'Middle school', 'Lycée': 'High school', 'Prépa': 'Preparatory class', 'Licence': 'Undergraduate', 'Master': "Master's", 'Doctorat': 'Doctorate' };
                const savedLevel = sessionStorage.getItem('userLevel');
                this.userLevel = legacyLevels[savedLevel] || savedLevel;
                this.userId = sessionStorage.getItem('userId') || `user-${Date.now()}`;
                this.memberToken = sessionStorage.getItem('kerneMemberToken') || crypto.randomUUID();
                sessionStorage.setItem('kerneMemberToken', this.memberToken);

                this.isCamOn = sessionStorage.getItem('isCamOn') !== 'false';
                this.isMicOn = sessionStorage.getItem('isMicOn') !== 'false';
                this.isSoundOn = sessionStorage.getItem('isSoundOn') !== 'false';
                this.selectedVideoDevice = localStorage.getItem('selectedVideoDevice');
                this.selectedAudioDevice = localStorage.getItem('selectedAudioDevice');
                this.hasMediaPermissions = { video: false, audio: false };
                this.mediaErrors = { video: false, audio: false };
                this.screenStream = null;
                this.remoteScreens = new Map();
                this.peerStreams = new Map();

                this.userColors = new Map(); this.colorIndex = 0;
            }

            async init() {
                if (!this.userName || !this.userLevel) { window.location.href = '/'; return; }
                document.getElementById('roomInfo').textContent = 'Devices...';
                await this.enumerateDevices();
                document.getElementById('roomInfo').textContent = 'Camera and microphone...';
                const mediaPromise = this.getLocalStream();
                const mediaReady = await Promise.race([
                    mediaPromise.then(() => true),
                    new Promise(resolve => setTimeout(() => resolve(false), 8000))
                ]);
                if (!mediaReady) mediaPromise.then(() => {
                    if (this.peers.size) this.restartTransport('Media enabled: reconnecting…');
                });
                document.getElementById('roomInfo').textContent = 'Connecting to room...';
                this.socket = new SignalingSocket(window.KERNE_SIGNAL_URL);
                this.setupSocketEvents();
                this.activities = new Activities(this);
                this.socket.connect();
                window.addEventListener('online', () => this.restartTransport());
                navigator.connection?.addEventListener?.('change', () => this.restartTransport());
                window.addEventListener('focus', async () => {
                    if (!navigator.permissions?.query) return;
                    for (const [kind, permission] of [['video', 'camera'], ['audio', 'microphone']]) {
                        if (!this.mediaErrors[kind]) continue;
                        try {
                            if ((await navigator.permissions.query({ name: permission })).state === 'granted') await this.requestTrack(kind);
                        } catch (_) {}
                    }
                });
            }

            async getLocalStream() {
                this.localStream ||= new MediaStream();
                await this.requestTrack('video', false);
                await this.requestTrack('audio', false);
            }

            async requestTrack(kind, reconnect = true) {
                if (reconnect) UI.showToast(`Requesting ${kind === 'video' ? 'camera' : 'microphone'} access…`);
                try {
                    const constraints = kind === 'video'
                        ? { video: { deviceId: this.selectedVideoDevice ? { exact: this.selectedVideoDevice } : undefined, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 20 }, facingMode: 'user' }, audio: false }
                        : { video: false, audio: { deviceId: this.selectedAudioDevice ? { exact: this.selectedAudioDevice } : undefined, echoCancellation: true, noiseSuppression: true } };
                    let stream;
                    try {
                        stream = await navigator.mediaDevices.getUserMedia(constraints);
                    } catch (error) {
                        const selected = kind === 'video' ? this.selectedVideoDevice : this.selectedAudioDevice;
                        if (!selected || !['OverconstrainedError', 'NotFoundError'].includes(error.name)) throw error;
                        if (kind === 'video') { this.selectedVideoDevice = null; localStorage.removeItem('selectedVideoDevice'); constraints.video.deviceId = undefined; }
                        else { this.selectedAudioDevice = null; localStorage.removeItem('selectedAudioDevice'); constraints.audio.deviceId = undefined; }
                        stream = await navigator.mediaDevices.getUserMedia(constraints);
                    }
                    const track = stream.getTracks().find(t => t.kind === kind);
                    if (!track) throw new Error('Device unavailable');
                    this.localStream ||= new MediaStream();
                    for (const old of this.localStream.getTracks().filter(t => t.kind === kind)) {
                        this.localStream.removeTrack(old);
                        old.stop();
                    }
                    this.localStream.addTrack(track);
                    if (kind === 'video') track.onended = () => {
                        if (!this.localStream?.getVideoTracks().includes(track)) return;
                        this.isCamOn = false;
                        UI.updateLocalCameraUI(false);
                        this.socket?.emit('state-change', { roomId: this.currentRoom, state: { cam: false } });
                    };
                    this.hasMediaPermissions[kind] = true;
                    this.mediaErrors[kind] = false;
                    const enabled = reconnect || (kind === 'video' ? this.isCamOn : this.isMicOn);
                    track.enabled = enabled;
                    if (kind === 'video') { this.isCamOn = enabled; UI.updateLocalCameraUI(enabled); }
                    else { this.isMicOn = enabled; UI.updateLocalMicUI(enabled); }
                    this.updatePermissionNotice();
                    if (this.mySocketId) UI.attachStream(this.mySocketId, this.localStream);
                    if (reconnect && this.peers.size) this.restartTransport('Media enabled: reconnecting…');
                    return true;
                } catch (error) {
                    console.error('Permission ' + kind, error);
                    this.mediaErrors[kind] = true;
                    if (kind === 'video') { this.isCamOn = false; UI.updateLocalCameraUI(false); }
                    else { this.isMicOn = false; UI.updateLocalMicUI(false); }
                    if (reconnect) UI.showToast(this.mediaFailureMessage(kind, error), true);
                    document.getElementById('permissionHelp').textContent = this.mediaFailureMessage(kind, error);
                    this.updatePermissionNotice();
                    return false;
                }
            }

            mediaFailureMessage(kind, error) {
                const device = kind === 'video' ? 'camera' : 'microphone';
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError')
                    return `${device} access blocked. Allow it in your site or browser settings, then try again.`;
                if (error.name === 'NotFoundError') return `No ${device} detected on this device.`;
                if (error.name === 'NotReadableError') return `${device} is in use by another app. Close it and try again.`;
                return `${device} is unavailable in this browser. Try an updated Chrome, Safari, or Firefox.`;
            }

            updatePermissionNotice() {
                const missing = Object.entries(this.mediaErrors).filter(([, failed]) => failed).map(([kind]) => kind === 'video' ? 'camera' : 'microphone');
                const notice = document.getElementById('permissionNotice');
                notice.classList.toggle('show', missing.length > 0);
                document.getElementById('permissionTitle').textContent = missing.length ? `${missing.join(' and ')} unavailable` : '';
                document.getElementById('retryRoomCamera').style.display = this.mediaErrors.video ? 'inline-block' : 'none';
                document.getElementById('retryRoomMic').style.display = this.mediaErrors.audio ? 'inline-block' : 'none';
            }

            async enumerateDevices() {
                if (!navigator.mediaDevices?.enumerateDevices) return;
                try { this.updateDeviceMenus(await navigator.mediaDevices.enumerateDevices()); } catch (_) {}
                navigator.mediaDevices.addEventListener?.('devicechange', async () => {
                    try { this.updateDeviceMenus(await navigator.mediaDevices.enumerateDevices()); } catch (_) {}
                });
            }

            updateDeviceMenus(devs) {
                const fills = (type, el, sel) => {
                    const list = devs.filter(d => d.kind === type);
                    el.innerHTML = '';
                    if (list.length > 1) document.getElementById(sel).style.display = 'flex';
                    list.forEach(d => {
                        const div = document.createElement('div'); div.className = 'device-menu-item'; div.textContent = d.label || type;
                        div.onclick = () => this.switchDevice(type, d.deviceId);
                        el.appendChild(div);
                    });
                };
                fills('videoinput', document.getElementById('camMenu'), 'camSelector');
                fills('audioinput', document.getElementById('micMenu'), 'micSelector');
                fills('audiooutput', document.getElementById('soundMenu'), 'soundSelector');
            }

            async switchDevice(type, id) {
                if (type === 'videoinput') { this.selectedVideoDevice = id; localStorage.setItem('selectedVideoDevice', id); }
                if (type === 'audioinput') { this.selectedAudioDevice = id; localStorage.setItem('selectedAudioDevice', id); }
                if (type === 'audiooutput') {
                    await Promise.allSettled([...document.querySelectorAll('video')].map(v => v.setSinkId?.(id)));
                } else {
                    const changed = await this.requestTrack(type === 'videoinput' ? 'video' : 'audio', false);
                    if (changed && this.peers.size) this.restartTransport('Device changed: reconnecting…');
                }
                document.querySelectorAll('.device-menu, .sound-device-menu').forEach(m => m.classList.remove('show'));
            }

            async toggleCamera() {
                if (!this.localStream?.getVideoTracks().length) {
                    if (await this.requestTrack('video')) this.socket?.emit('state-change', { roomId: this.currentRoom, state: { cam: true } });
                    return;
                }
                this.isCamOn = !this.isCamOn; sessionStorage.setItem('isCamOn', this.isCamOn);
                if (this.localStream) this.localStream.getVideoTracks().forEach(t => t.enabled = this.isCamOn);
                UI.updateLocalCameraUI(this.isCamOn);
                this.socket.emit('state-change', { roomId: this.currentRoom, peerId: this.socket.id, state: { cam: this.isCamOn } });
            }

            async toggleMic() {
                if (!this.localStream?.getAudioTracks().length) {
                    if (await this.requestTrack('audio')) this.socket?.emit('state-change', { roomId: this.currentRoom, state: { mic: true } });
                    return;
                }
                this.isMicOn = !this.isMicOn; sessionStorage.setItem('isMicOn', this.isMicOn);
                if (this.localStream) this.localStream.getAudioTracks().forEach(t => t.enabled = this.isMicOn);
                UI.updateLocalMicUI(this.isMicOn);
                this.socket.emit('state-change', { roomId: this.currentRoom, peerId: this.socket.id, state: { mic: this.isMicOn } });
            }

            toggleSound() {
                this.isSoundOn = !this.isSoundOn; sessionStorage.setItem('isSoundOn', this.isSoundOn);
                document.querySelectorAll('.video-element > video').forEach(v => {
                    if (v.closest('.video-element').id !== `video-${this.mySocketId}`) v.muted = !this.isSoundOn;
                });
                UI.updateSoundUI(this.isSoundOn);
                this.socket.emit('state-change', { roomId: this.currentRoom, peerId: this.socket.id, state: { sound: this.isSoundOn } });
            }

            async toggleScreenShare() {
                if (this.screenStream) { this.stopScreenShare(); return; }
                if (!navigator.mediaDevices?.getDisplayMedia) {
                    UI.showToast("Screen sharing is unavailable in this browser", true);
                    return;
                }
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
                        audio: false
                    });
                    this.screenStream = stream;
                    const screenTrack = stream.getVideoTracks()[0];
                    if ('contentHint' in screenTrack) screenTrack.contentHint = 'detail';
                    screenTrack.addEventListener('ended', () => this.stopScreenShare(), { once: true });
                    document.getElementById('screenShareBtn').classList.add('active');
                    document.getElementById('shareScreenMenu').textContent = 'Stop sharing';
                    UI.addScreenVideo(this.mySocketId, stream, 'My screen', true);
                    this.socket?.emit('screen-share-started', { streamId: stream.id });
                    for (const peer of this.peers.values()) { peer.addStream(stream); this.optimizeScreenSender(peer); }
                } catch (error) {
                    if (error.name !== 'NotAllowedError') UI.showToast("Could not share screen", true);
                }
            }

            stopScreenShare() {
                const stream = this.screenStream;
                if (!stream) return;
                this.screenStream = null;
                for (const peer of this.peers.values()) {
                    try { peer.removeStream(stream); } catch (_) {}
                }
                stream.getTracks().forEach(track => track.stop());
                this.socket?.emit('screen-share-stopped', {});
                UI.removeScreenVideo(this.mySocketId);
                document.getElementById('screenShareBtn').classList.remove('active');
                document.getElementById('shareScreenMenu').textContent = 'Share screen';
            }

            async optimizeScreenSender(peer) {
                const track = this.screenStream?.getVideoTracks()[0];
                const sender = peer._pc?.getSenders().find(s => s.track?.id === track?.id);
                if (!sender?.getParameters || !sender?.setParameters) return;
                try {
                    const params = sender.getParameters();
                    params.encodings ||= [{}];
                    params.encodings[0].maxBitrate = 4_000_000;
                    await sender.setParameters(params);
                } catch (_) {}
            }

            setupSocketEvents() {
                this.socket.on('connect', () => {
                    this.mySocketId = this.socket.id;
                    this.iceReady = false;
                    UI.updateLocalCameraUI(this.isCamOn);
                    this.socket.emit('join-room', { name: this.userName, level: this.userLevel, peerId: this.socket.id, memberToken: this.memberToken, resumeRoom: this.currentRoom, privateRoomCode: this.privateRoomCode });
                });
                this.socket.on('room-joined', ({ roomId, users, userStates, screenShares }) => {
                    this.currentRoom = roomId; sessionStorage.setItem('currentRoom', roomId);
                    this.userId = users.find(u => u.socketId === this.mySocketId)?.userId || this.userId;
                    this.remoteScreens = new Map((screenShares || []).map(s => [s.peerId, s.streamId]));
                    this.userInfo.set(this.mySocketId, { name: this.userName, level: this.userLevel });
                    UI.addVideo(this.mySocketId, this.localStream, this.userName, this.userLevel, true);

                    UI.updatePeerState(this.mySocketId, { cam: this.isCamOn, mic: this.isMicOn, sound: this.isSoundOn });

                    users.forEach(u => { if (u.socketId !== this.mySocketId) { this.userInfo.set(u.socketId, u); UI.addVideo(u.socketId, null, u.name, u.level, false); } });
                    UI.updateParticipants(this.userInfo, this.mySocketId);

                    if (userStates) userStates.forEach(s => UI.updatePeerState(s.peerId, s.state));

                    this.socket.emit('state-change', { roomId: this.currentRoom, peerId: this.mySocketId, state: { cam: this.isCamOn, mic: this.isMicOn, sound: this.isSoundOn } });
                    if (this.screenStream) this.socket.emit('screen-share-started', { streamId: this.screenStream.id });
                    const joinedSocketId = this.mySocketId;
                    this.socket.timeout(9000).emit('request-ice-servers', (error, response) => {
                        if (joinedSocketId !== this.mySocketId || !this.socket.connected) return;
                        if (!error && Array.isArray(response?.iceServers)) ICE_CONFIG = { iceServers: response.iceServers };
                        this.iceReady = true;
                        if (response?.turnEnabled === false) UI.showToast('TURN is unavailable; video may fail on some networks');
                        users.forEach(u => {
                            if (u.socketId !== this.mySocketId && this.userInfo.has(u.socketId) && !this.peers.has(u.socketId)) this.createPeer(u.socketId, true);
                        });
                        for (const item of this.pendingSignals.splice(0)) this.receiveSignal(item);
                    });
                });
                this.socket.on('user-joined', (u) => {
                    this.userInfo.set(u.socketId, u); UI.addVideo(u.socketId, null, u.name, u.level, false); UI.updateParticipants(this.userInfo, this.mySocketId); UI.showToast(`${u.name} joined`);
                    this.socket.emit('state-change', { roomId: this.currentRoom, peerId: this.mySocketId, state: { cam: this.isCamOn, mic: this.isMicOn, sound: this.isSoundOn } });
                });
                this.socket.on('signal', (item) => {
                    if (!this.iceReady) this.pendingSignals.push(item);
                    else this.receiveSignal(item);
                });
                this.socket.on('user-left', ({ socketId }) => { this.removePeer(socketId); });
                this.socket.on('screen-share-started', ({ peerId, streamId }) => {
                    this.remoteScreens.set(peerId, streamId);
                    this.renderPeerStreams(peerId);
                });
                this.socket.on('screen-share-stopped', ({ peerId }) => {
                    const streamId = this.remoteScreens.get(peerId);
                    this.remoteScreens.delete(peerId);
                    this.peerStreams.get(peerId)?.delete(streamId);
                    UI.removeScreenVideo(peerId);
                    this.renderPeerStreams(peerId);
                });
                this.socket.on('screen-share-denied', ({ message }) => { this.stopScreenShare(); UI.showToast(message, true); });
                this.socket.on('disconnect', () => {
                    this.iceReady = false;
                    this.pendingSignals = [];
                    for (const id of [...this.peers.keys()]) this.removePeer(id);
                    for (const id of this.remoteScreens.keys()) UI.removeScreenVideo(id);
                    this.remoteScreens.clear();
                    this.peerStreams.clear();
                    if (this.mySocketId) { this.userInfo.delete(this.mySocketId); UI.removeVideo(this.mySocketId); }
                    // Keep the room hint for an authenticated game reconnect.
                });
                this.socket.on('chat-message', ({ from, message }) => UI.addChatMessage(from, message, from === this.userName));

                this.socket.on('state-change', ({ peerId, state }) => {
                    const u = this.userInfo.get(peerId);
                    if (u) { u.state = { ...u.state, ...state }; UI.updatePeerState(peerId, u.state); }
                    else if (peerId === this.mySocketId) { UI.updatePeerState(peerId, state); }
                });
            }

            receiveSignal({ from, signal }) {
                if (!this.userInfo.has(from)) return;
                if (!this.peers.has(from)) this.createPeer(from, false);
                try { this.peers.get(from)?.signal(signal); } catch (error) { this.restartTransport(); }
            }

            restartTransport(message = 'Network changed: reconnecting to room…') {
                if (!this.socket || !navigator.onLine) return;
                const now = Date.now();
                if (now - this.lastTransportRestart < 5000) return;
                this.lastTransportRestart = now;
                UI.showToast(message);
                this.socket.disconnect();
                setTimeout(() => this.socket.connect(), 300);
            }

            createPeer(peerId, initiator) {
                if (this.peers.has(peerId) || !this.userInfo.has(peerId)) return;
                const peer = new SimplePeer({ initiator, stream: this.localStream?.getTracks().length ? this.localStream : undefined, config: ICE_CONFIG });
                peer.on('signal', (sig) => this.socket.emit('signal', { to: peerId, signal: sig }));
                peer.on('connect', () => this.optimizeScreenSender(peer));
                peer.on('stream', (stream) => {
                    if (!this.peerStreams.has(peerId)) this.peerStreams.set(peerId, new Map());
                    this.peerStreams.get(peerId).set(stream.id, stream);
                    this.renderPeerStreams(peerId);
                });
                peer.on('error', () => { if (this.peers.get(peerId) === peer) this.restartTransport(); });
                peer.on('close', () => { if (this.peers.get(peerId) === peer) this.restartTransport(); });
                peer._pc?.addEventListener('iceconnectionstatechange', () => {
                    const state = peer._pc?.iceConnectionState;
                    if (state === 'failed') this.restartTransport();
                    if (state === 'disconnected') setTimeout(() => {
                        if (this.peers.get(peerId) === peer && peer._pc?.iceConnectionState === 'disconnected') this.restartTransport();
                    }, 6000);
                });
                this.peers.set(peerId, peer);
                if (this.screenStream) { peer.addStream(this.screenStream); this.optimizeScreenSender(peer); }
            }

            renderPeerStreams(peerId) {
                const streams = this.peerStreams.get(peerId);
                if (!streams) return;
                const screenId = this.remoteScreens.get(peerId);
                const screen = streams.get(screenId);
                if (screen) UI.addScreenVideo(peerId, screen, `${this.userInfo.get(peerId)?.name || 'Student'} is sharing their screen`);
                const camera = [...streams].find(([id]) => id !== screenId)?.[1];
                if (camera) UI.attachStream(peerId, camera);
                else if (screen) UI.clearStream(peerId);
            }

            removePeer(peerId) {
                if (this.peers.has(peerId)) { const peer = this.peers.get(peerId); this.peers.delete(peerId); peer.destroy(); }
                this.peerStreams.delete(peerId);
                this.userInfo.delete(peerId); this.remoteScreens.delete(peerId); UI.removeScreenVideo(peerId); UI.removeVideo(peerId); UI.updateParticipants(this.userInfo, this.mySocketId);
            }

            getColorForUser(id) {
                if (!this.userColors.has(id)) { this.colorIndex = (this.colorIndex % 6) + 1; this.userColors.set(id, `color-${this.colorIndex}`); }
                return this.userColors.get(id);
            }
        }

        class UIManager {
            constructor() {
                this.videoGrid = document.getElementById('videoGrid');
                this.participantsList = document.getElementById('participantsList');
                this.cameraStrip = document.getElementById('cameraStrip');
                this.screenStage = document.getElementById('screenStage');
                this.viewer = new ScreenViewer();
                const more = document.createElement('details'); more.className = 'room-more'; more.id = 'roomMore';
                more.innerHTML = `<summary aria-label="More call controls" title="More call controls">•••</summary><div class="room-more-menu"><button class="mobile-only" id="shareScreenMenu">Share screen</button><button data-device-menu="camMenu">Camera device</button><button data-device-menu="micMenu">Microphone device</button><button data-device-menu="soundMenu">Audio output</button></div>`;
                document.querySelector('.controls').insertBefore(more, document.getElementById('leaveBtn'));
                const sound = document.querySelector('.sound-control-wrapper');
                const soundLabel = document.createElement('span'); soundLabel.className = 'sound-label'; soundLabel.textContent = 'Call sound';
                sound.append(soundLabel); more.querySelector('.room-more-menu').append(sound);
                document.getElementById('shareScreenMenu').onclick = () => { more.open = false; manager.toggleScreenShare(); };
                more.querySelectorAll('[data-device-menu]').forEach(button => button.onclick = () => {
                    const menu = document.getElementById(button.dataset.deviceMenu);
                    more.open = menu.id === 'soundMenu';
                    document.querySelectorAll('.device-menu,.sound-device-menu').forEach(other => other.classList.remove('show'));
                    requestAnimationFrame(() => menu.classList.add('show'));
                });
                document.addEventListener('click', event => { if (!more.contains(event.target)) more.open = false; });
                const back = document.createElement('button'); back.className = 'sidebar-close'; back.textContent = '← Back to call'; back.onclick = () => document.getElementById('sidebarOverlay').click();
                document.getElementById('sidebar').prepend(back);
                document.querySelectorAll('.control-btn').forEach(button => { if (button.title) button.setAttribute('aria-label',button.title); });
                new ResizeObserver(() => this.resizeGrid()).observe(this.videoGrid);
            }

            addVideo(peerId, stream, name, level, isLocal) {
                if (document.getElementById(`video-${peerId}`)) return;
                const c = document.createElement('div'); c.className = 'video-element' + (!isLocal ? ' joining' : ''); c.id = `video-${peerId}`;
                const v = document.createElement('video'); v.autoplay = true; v.playsInline = true;
                if (isLocal) { v.muted = true; v.style.transform = 'scaleX(-1)'; if (stream) v.srcObject = stream; }
                else { v.muted = !manager.isSoundOn; }

                const color = manager.getColorForUser(peerId);

                c.innerHTML = `
                    <div class="video-avatar" style="display:${stream ? 'none' : 'flex'}"><div class="avatar-circle ${color}"></div><div class="avatar-name"></div></div>
                    <div class="video-overlay"><div class="video-name"></div></div>
                    <button class="fullscreen-btn">⛶</button>
                    <div class="status-badge status-mic" title="Microphone off"><svg viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M19 10v2a7 7 0 0 1-2.9 5.69M5 10v2a7 7 0 0 0 11.9 4.11"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></div>
                    <div class="status-badge status-sound" title="Sound off"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg></div>
                `;
                c.querySelector('.avatar-circle').textContent = (name || 'U').charAt(0);
                c.querySelector('.avatar-name').textContent = name;
                c.querySelector('.video-name').textContent = `${name} (${level})`;
                c.insertBefore(v, c.firstChild);
                c.querySelector('.fullscreen-btn').onclick = (e) => { e.stopPropagation(); this.toggleFullscreen(peerId); };
                c.querySelector('.fullscreen-btn').setAttribute('aria-label',`Focus ${name || 'camera'}`);
                this.cameraStrip.appendChild(c); this.setCameraVisibility(c, isLocal ? manager.isCamOn : false); this.resizeGrid();
            }

            setCameraVisibility(tile, enabled) {
                tile.dataset.cameraOn = String(enabled);
                tile.querySelector('video').style.display = enabled && tile.querySelector('video').srcObject ? 'block' : 'none';
                tile.querySelector('.video-avatar').style.display = enabled && tile.querySelector('video').srcObject ? 'none' : 'flex';
                manager.activities?.refreshCameras();
                this.viewer.refresh();
            }

            attachStream(peerId, stream) {
                const c = document.getElementById(`video-${peerId}`); if (!c) return;
                c.querySelector('video').srcObject = stream;
                this.setCameraVisibility(c, c.dataset.cameraOn === 'true');
            }

            clearStream(peerId) {
                const c = document.getElementById(`video-${peerId}`); if (!c) return;
                c.querySelector('video').srcObject = null;
                this.setCameraVisibility(c, c.dataset.cameraOn === 'true');
            }

            addScreenVideo(peerId, stream, label, isLocal = false) {
                const existing = document.getElementById(`screen-${peerId}`);
                if (existing) { existing.querySelector('video').srcObject = stream; return; }
                const tile = document.createElement('div');
                tile.className = 'video-element screen-share';
                tile.id = `screen-${peerId}`;
                const video = document.createElement('video');
                video.autoplay = true;
                video.playsInline = true;
                video.muted = isLocal;
                video.srcObject = stream;
                const overlay = document.createElement('div');
                overlay.className = 'video-overlay';
                const name = document.createElement('div');
                name.className = 'video-name';
                name.textContent = label;
                overlay.appendChild(name);
                const zoom = document.createElement('button');
                zoom.className = 'fullscreen-btn';
                zoom.textContent = 'Full view ⛶';
                zoom.title = 'Open shared screen with zoom'; zoom.setAttribute('aria-label',zoom.title);
                zoom.onclick = event => { event.stopPropagation(); this.toggleFullscreenElement(tile.id); };
                tile.append(video, overlay, zoom);
                this.screenStage.appendChild(tile);
                this.resizeGrid();
            }

            removeScreenVideo(peerId) {
                document.getElementById(`screen-${peerId}`)?.remove();
                this.resizeGrid();
            }

            removeVideo(peerId) {
                const el = document.getElementById(`video-${peerId}`);
                if (el?.classList.contains('fullscreen-active')) this.videoGrid.classList.remove('fullscreen-mode');
                el?.remove(); this.resizeGrid(); manager.activities?.refreshCameras();
            }

            updateLocalCameraUI(isOn) {
                const btn = document.getElementById('camBtn');
                btn.classList.toggle('active', isOn); btn.classList.toggle('inactive', !isOn);
                const local = document.getElementById(`video-${manager.mySocketId}`);
                if (local) this.setCameraVisibility(local, isOn);
            }

            updateLocalMicUI(isOn) {
                const btn = document.getElementById('micBtn'); btn.classList.toggle('active', isOn); btn.classList.toggle('inactive', !isOn);
                btn.innerHTML = isOn ? '<svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>' : '<svg viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M19 10v2a7 7 0 0 1-2.9 5.69M5 10v2a7 7 0 0 0 11.9 4.11"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
                this.updatePeerState(manager.mySocketId, { mic: isOn });
            }

            updateSoundUI(isOn) {
                const btn = document.getElementById('soundBtn'); btn.classList.toggle('active', isOn); btn.classList.toggle('inactive', !isOn);
                btn.innerHTML = isOn ? '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>' : '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
                this.updatePeerState(manager.mySocketId, { sound: isOn });
            }

            updatePeerState(peerId, state) {
                const c = document.getElementById(`video-${peerId}`); if (!c) return;

                if (state.cam !== undefined) this.setCameraVisibility(c, state.cam);

                if (state.mic !== undefined) {
                    c.classList.toggle('mic-off', !state.mic);
                }

                if (state.sound !== undefined) {
                    c.classList.toggle('sound-off', !state.sound);
                }
            }

            toggleFullscreen(peerId) {
                this.toggleFullscreenElement(`video-${peerId}`);
            }

            toggleFullscreenElement(elementId) {
                const grid = this.videoGrid;
                const tile = document.getElementById(elementId);
                if (tile?.classList.contains('screen-share')) { this.viewer.open(tile); return; }
                if (grid.classList.contains('fullscreen-mode')) {
                    grid.classList.remove('fullscreen-mode');
                    document.querySelectorAll('.fullscreen-active').forEach(e => e.classList.remove('fullscreen-active'));
                } else {
                    grid.classList.add('fullscreen-mode');
                    document.getElementById(elementId)?.classList.add('fullscreen-active');
                }
                this.resizeGrid();
            }

            updateParticipants(map, myId) {
                this.participantsList.innerHTML = '';
                map.forEach((u, id) => {
                    const d = document.createElement('div'); d.className = `participant-item ${manager.getColorForUser(id)}`;
                    const label = document.createElement('div');
                    label.className = 'participant-name';
                    label.textContent = `${u.name}${id === myId ? ' (Me)' : ''}`;
                    d.appendChild(label);
                    this.participantsList.appendChild(d);
                });
                document.getElementById('roomInfo').textContent = manager.privateRoomCode
                    ? `Room ${manager.privateRoomCode} • ${map.size}` : `Room • ${map.size}`;
            }

            addChatMessage(from, msg, isMe) {
                const d = document.createElement('div'); d.className = 'chat-message' + (isMe ? ' me' : '');
                const author = document.createElement('div'); author.className = 'chat-message-author';
                author.append(document.createTextNode(from));
                const time = document.createElement('span'); time.className = 'chat-message-time'; time.textContent = new Date().toLocaleTimeString().slice(0, 5);
                author.appendChild(time);
                const body = document.createElement('div'); body.textContent = msg;
                d.append(author, body);
                const c = document.getElementById('chatMessages'); c.appendChild(d); c.scrollTop = c.scrollHeight;
                if (!isMe && document.getElementById('appContainer').classList.contains('sidebar-closed')) document.getElementById('sidebarToggle').classList.add('has-notif');
            }

            showToast(msg, err = false, type = '') {
                const t = document.getElementById('toast'); t.textContent = msg; t.className = `toast show ${err ? 'error' : ''} ${type}`;
                setTimeout(() => t.classList.remove('show'), 3000);
            }

            resizeGrid() {
                const vids = [...this.videoGrid.querySelectorAll('.video-element')];
                const sharing = vids.some(v => v.classList.contains('screen-share'));
                this.videoGrid.classList.toggle('has-screen-share', sharing);
                document.body.classList.toggle('screen-sharing', sharing);
                this.viewer?.refresh();
                if (!vids.length) return;
                if (sharing) { vids.forEach(v => { v.style.width = ''; v.style.height = ''; }); return; }

                const rect = this.cameraStrip.getBoundingClientRect();
                const count = vids.length;

                // Fit camera tiles to the available stage
                // Remove grid padding from available width
                const padding = 4;
                const gap = 10; // Space between videos

                const availW = Math.max(0, rect.width - padding);
                const availH = Math.max(0, rect.height - padding);
                const aspect = count === 1 && window.innerWidth <= 600 ? 3 / 4 : 16 / 9;

                let best = { w: 0, h: 0, cols: 1 };

                for (let cols = 1; cols <= count; cols++) {
                    const rows = Math.ceil(count / cols);

                    // Maximum video width including gaps
                    let w = (availW - (cols - 1) * gap) / cols;

                    // Preserve the chosen aspect ratio
                    let h = w / aspect;

                    // Recalculate if video exceeds available height
                    if (h * rows + (rows - 1) * gap > availH) {
                        h = (availH - (rows - 1) * gap) / rows;
                        w = h * aspect;
                    }

                    if (w > best.w) {
                        best = { w, h, cols };
                    }
                }

                vids.forEach(v => {
                    v.style.width = best.w + 'px';
                    v.style.height = best.h + 'px';
                });
            }
        }

        const manager = new WebRTCManager();
        const UI = new UIManager();

        window.addEventListener('load', () => {
            if (!sessionStorage.getItem('userName')) { window.location.href = '/'; return; }
            UI.updateSoundUI(manager.isSoundOn);
            manager.init().catch(error => {
                console.error(error);
                document.getElementById('roomInfo').textContent = 'Could not connect';
            });
        });

        // Event Listeners UI
        document.getElementById('camBtn').onclick = () => manager.toggleCamera();
        document.getElementById('micBtn').onclick = () => manager.toggleMic();
        document.getElementById('screenShareBtn').onclick = () => manager.toggleScreenShare();
        document.getElementById('retryRoomCamera').onclick = () => manager.requestTrack('video');
        document.getElementById('retryRoomMic').onclick = () => manager.requestTrack('audio');
        document.getElementById('dismissPermissionNotice').onclick = () => document.getElementById('permissionNotice').classList.remove('show');
        document.getElementById('soundBtn').onclick = () => manager.toggleSound();
        document.getElementById('leaveBtn').onclick = () => { window.location.href = '/'; };
        document.getElementById('chatForm').onsubmit = (e) => {
            e.preventDefault(); const i = document.getElementById('chatInput');
            if (i.value.trim()) { manager.socket.emit('chat-message', { roomId: manager.currentRoom, message: i.value }); i.value = ''; }
        };
        document.getElementById('sidebarToggle').onclick = function () {
            this.classList.remove('has-notif');
            // Mobile sidebar and backdrop
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.toggle('mobile-open');
                document.getElementById('sidebarOverlay').classList.toggle('active');
                document.body.classList.toggle('sidebar-open');
            }
            else {
                document.getElementById('appContainer').classList.toggle('sidebar-closed');
            }
            setTimeout(() => UI.resizeGrid(), 450);
        };

        document.querySelectorAll('.sidebar-tab').forEach(t => t.onclick = (e) => {
            document.querySelectorAll('.sidebar-tab').forEach(x => x.classList.remove('active')); e.target.classList.add('active');
            document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
            document.getElementById(`${e.target.dataset.tab}Panel`).classList.add('active');
        });

        document.getElementById('sidebarOverlay').onclick = () => {
            document.getElementById('sidebar').classList.remove('mobile-open');
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.body.classList.remove('sidebar-open');
        };

        // Selectors Logic Updated
        const toggleMenu = (e, id) => {
            e.stopPropagation();
            document.querySelectorAll('.device-menu, .sound-device-menu').forEach(m => m.id !== id ? m.classList.remove('show') : null);
            document.getElementById(id).classList.toggle('show');
        };
        document.getElementById('camSelector').onclick = (e) => toggleMenu(e, 'camMenu');
        document.getElementById('micSelector').onclick = (e) => toggleMenu(e, 'micMenu');
        document.getElementById('soundSelector').onclick = (e) => toggleMenu(e, 'soundMenu');
        document.addEventListener('click', () => document.querySelectorAll('.device-menu, .sound-device-menu').forEach(m => m.classList.remove('show')));

        window.addEventListener('resize', () => UI.resizeGrid());
    </script>
</body>
